name: Marktbuch Discord

on:
  schedule:
    - cron: "7 * * * *"      # Minute 7 (UTC): neuer Post, der vorherige wird gelöscht
    - cron: "37 * * * *"     # Minute 37 (UTC): denselben Post mit frischen Preisen bearbeiten
                             # (nicht :00/:30: da sind GitHubs Warteschlangen voll, Läufe verschieben sich oder fallen aus)
  workflow_dispatch:         # Knopf "Run workflow" für einen Lauf von Hand

permissions:
  contents: write            # damit der Lauf die Nachricht-ID (State) zurück ins Repo schreiben darf

concurrency:
  group: marktbuch
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Marktbuch posten
        env:
          MARKTBUCH_WEBHOOK: ${{ secrets.MARKTBUCH_WEBHOOK }}
          PYTHONIOENCODING: utf-8
        # Lauf der Minute 7 (und Handstart) postet neu, Lauf der Minute 37 bearbeitet
        run: python marktbuch_discord.py ${{ github.event.schedule != '37 * * * *' && '--neu' || '' }}

      - name: Datenpaket fürs Marktbuch-Artefakt bauen
        env:
          TZ: Europe/Berlin
        run: python artefakt_bundle.py /tmp/artefakt

      - name: Datenpaket auf Branch "daten" ablegen (ohne Verlauf, wird jedes Mal ersetzt)
        run: |
          cd /tmp/artefakt
          git init -q -b daten
          git config user.name "marktbuch-bot"
          git config user.email "marktbuch-bot@users.noreply.github.com"
          git add artefakt.json
          git commit -q -m "Datenpaket $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" daten

      - name: Nachricht-ID im Repo sichern
        run: |
          git config user.name "marktbuch-bot"
          git config user.email "marktbuch-bot@users.noreply.github.com"
          git add marktbuch_discord_state.json
          git diff --cached --quiet && exit 0
          git commit -m "State: Nachricht-ID aktualisiert"
          git pull --rebase origin main   # falls inzwischen von Hand gepusht wurde
          git push
